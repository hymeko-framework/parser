[package]
name = "parser"
version = "0.1.0"
edition = "2024"

[build-dependencies]
lalrpop = ">=0.22.2"

[dependencies]
lalrpop-util = { version = ">=0.22.2", features = ["lexer", "unicode"]}
[dev-dependencies]
criterion = "0.8.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
quick-xml = { version = "0.42", features = ["serialize"] }
roxmltree = "0.21"
serde-saphyr = "1.2"
blake3 = "1"
[[bench]]
name = "parser_bench"
harness = false
[[bench]]
name = "format_bench"
harness = false
